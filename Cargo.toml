[package]
name = "bmi323"
version = "0.1.0"
edition = "2021"
readme = "README.md"
authors = ["Wyatt Mattas <mattaswm@gmail.com>"]
repository = "https://github.com/wyatt-mattas/bmi323-rs/"
keywords = [
    "inertial",
    "accelerometer",
    "gyroscope",
    "imu",
    "embedded-hal-driver",
]
categories = ["embedded", "hardware-support", "no-std"]
license = "Apache-2.0"
documentation = "https://docs.rs/bmi323"
description = "Platform agnostic Rust driver for the BMI323 IMU."
homepage = "https://github.com/wyatt-mattas/bmi323-rs/"

include = [
    "/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
]

[dependencies]
embedded-hal = "1.0.0"
num-derive = "0.4.2"
num-traits = {version = "0.2.19", default-features = false}
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
defmt ={version = "1.0", optional = true}

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", features = ["eh1"] }

[features]
serde = ["dep:serde"]
